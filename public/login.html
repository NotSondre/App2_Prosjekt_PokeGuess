<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logg inn - PokéGuess</title>
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>

<div class="auth-container">
    <img src="Images/Poke-Guessr_Logo.png" alt="Logo" style="height: 70px; margin-bottom: 35px;">
    
    <div class="tabs">
        <div id="loginTab" class="tab active" onclick="switchTab('login')">Logg inn</div>
        <div id="registerTab" class="tab" onclick="switchTab('register')">Registrer</div>
    </div>

    <div id="authForm">
        <div class="form-group">
            <label for="username">Brukernavn</label>
            <input type="text" id="username" placeholder="Ditt brukernavn...">
        </div>
        
        <div class="form-group">
            <label for="password">Passord</label>
            <input type="password" id="password" placeholder="******">
        </div>

        <div id="registerOnly" style="display: none;">
            <div class="consent-box">
                <input type="checkbox" id="consent">
                <label for="consent">
                    Jeg godtar 
                    <a href="Terms Of Service - PokeGuesser.pdf" target="_blank" style="color: #2a75bb; text-decoration: underline;">Terms of Service</a> 
                    og 
                    <a href="Privacy Policy - PokeGuesser.pdf" target="_blank" style="color: #2a75bb; text-decoration: underline;">Privacy Policy</a>.
                </label>
            </div>
        </div>

        <div id="errorMessage"></div>
        
        <button id="submitBtn" class="btn-auth" onclick="handleAuth()">Logg inn</button>
    </div>

    <p style="margin-top: 20px;"><a href="index.html" style="color: #666; text-decoration: none; font-size: 0.9rem;">← Tilbake til spillet</a></p>
</div>

<script src="login.js"></script>
</body>
</html>
