<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PokéGuess - Et spill for å gjette Pokémon navn.">
    <title>App2 - PokéGuess</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="app.css">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #ffffff; color: #000000; margin: 0; } 
        
        .login-trigger {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            z-index: 100;
        }

        user-manager {
            display: none;
            position: absolute;
            top: 70px;
            right: 20px;
            z-index: 99;
        }

        user-manager.active {
            display: block;
        }

        .status-box { border: 2px solid #000; padding: 10px; margin: 20px auto; max-width: 300px; border-radius: 5px; font-weight: bold; }
        .game-area { margin-top: 100px; padding: 20px; border: 2px solid #000; border-radius: 8px; display: inline-block; }
        input, button { min-height: 44px; font-size: 1rem; }
    </style>
</head>
<body>

    <button class="login-trigger" id="toggleLogin" aria-label="Åpne logg inn eller registrer">
        Logg inn / Bruker
    </button>

    <main>
        <h1>PokéGuess</h1>
        
        <div id="status" class="status-box" aria-live="polite">Kobler til backend...</div>

        <user-manager id="userMenu"></user-manager>

        <div class="game-area" role="region" aria-label="Spillområde">
            <input type="text" id="pokemonInput" placeholder="Skriv Pokémon-navn..." aria-label="Pokémon navn">
            <button onclick="sendGuess()" aria-label="Send gjett">Gjett!</button>
            <div id="guessResult" style="margin-top: 15px; font-weight: bold;" aria-live="polite"></div>
        </div>
    </main>

    <template id="user-manager-template">
        <style>
            .user-box { 
                border: 2px solid #000; 
                padding: 15px; 
                max-width: 300px; 
                border-radius: 5px; 
                text-align: left;
                background-color: #fff;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            }
            input { display: block; width: 100%; margin-bottom: 10px; box-sizing: border-box; min-height: 44px; border: 1px solid #000; }
            .btns { display: flex; gap: 10px; margin-top: 10px; }
            button { min-height: 44px; padding: 5px 15px; cursor: pointer; background: #eee; border: 1px solid #000; }
            #msg { margin-top: 10px; font-style: italic; color: #000; font-weight: bold; }
            a { color: #0000EE; text-decoration: underline; font-weight: 800; }
            label { font-size: 0.9rem; display: block; margin-bottom: 10px; color: #000; }
            #consent { width: 20px; height: 20px; vertical-align: middle; margin-right: 5px; }
        </style>
        <div class="user-box" role="form" aria-label="Bruker registrering">
            <label for="uname">Brukernavn</label>
            <input type="text" id="uname" name="uname" placeholder="Brukernavn">
            
            <label for="psw">Passord</label>
            <input type="password" id="psw" name="psw" placeholder="Passord">
            
            <label>
                <input type="checkbox" id="consent" aria-label="Godta vilkår"> 
                Jeg godtar <a href="Terms%20Of%20Service%20-%20PokeGuesser.pdf" target="_blank" rel="noopener">ToS</a> 
                og <a href="Privacy%20Policy%20-%20PokeGuesser.pdf" target="_blank" rel="noopener">Privacy</a>.
            </label>

            <div class="btns">
                <button id="regBtn" aria-label="Registrer ny bruker">Registrer</button>
                <button id="delBtn" aria-label="Slett min bruker">Slett</button>
            </div>
            <p id="msg" aria-live="polite"></p>
        </div>
    </template>

    <script type="module" src="app.js"></script>
    <script>
        document.getElementById('toggleLogin').onclick = () => {
            const menu = document.getElementById('userMenu');
            menu.classList.toggle('active');
        };
    </script>
    <script type="module">
        import { sendGuess } from './app.js';
        window.sendGuess = sendGuess;
    </script>
</body>
</html>
