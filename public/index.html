<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PokéGuess - Logg inn eller registrer deg for å spille.">
    <title>App2 - PokéGuess</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="app.css">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #ffffff; color: #000; margin: 0; } 
        
        .login-trigger {
            position: absolute; top: 20px; right: 20px;
            padding: 10px 20px; background: #000; color: #fff;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold; z-index: 100;
        }

        user-manager {
            display: none; position: absolute; top: 70px; right: 20px; z-index: 99;
        }

        user-manager.active { display: block; }

        .status-box { border: 2px solid #000; padding: 10px; margin: 20px auto; max-width: 300px; border-radius: 5px; }
        .game-area { margin-top: 100px; padding: 20px; border: 2px solid #000; border-radius: 8px; display: inline-block; }
    </style>
</head>
<body>

    <button class="login-trigger" id="toggleLogin" aria-label="Åpne brukermeny">
        Konto
    </button>

    <main>
        <h1>PokéGuess</h1>
        <div id="status" class="status-box" aria-live="polite">Kobler til backend...</div>
        <user-manager id="userMenu"></user-manager>

        <div class="game-area" role="region" aria-label="Spillområde">
            <input type="text" id="pokemonInput" placeholder="Skriv Pokémon..." aria-label="Pokémon navn">
            <button onclick="sendGuess()">Gjett!</button>
            <div id="guessResult" style="margin-top: 15px; font-weight: bold;" aria-live="polite"></div>
        </div>
    </main>

    <template id="user-manager-template">
        <style>
            .user-box { 
                border: 2px solid #000; padding: 20px; max-width: 300px; 
                border-radius: 8px; text-align: left; background: #fff;
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            }
            .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 15px; }
            .tab-btn { 
                flex: 1; border: none; background: none; padding: 10px; 
                cursor: pointer; font-weight: bold; color: #666; 
            }
            .tab-btn.active { color: #000; border-bottom: 2px solid #000; }

            input { display: block; width: 100%; margin-bottom: 10px; box-sizing: border-box; min-height: 44px; border: 1px solid #000; padding: 5px; }
            .action-btn { width: 100%; min-height: 44px; background: #000; color: #fff; border: none; cursor: pointer; margin-top: 10px; }
            .del-link { display: block; text-align: center; margin-top: 15px; font-size: 0.8rem; color: #d00; cursor: pointer; text-decoration: underline; }
            
            #msg { margin-top: 10px; font-style: italic; font-weight: bold; }
            .tos-area { font-size: 0.85rem; margin-top: 10px; display: none; } /* Skjult som standard */
            .tos-area.visible { display: block; }
            a { color: #0000EE; font-weight: 800; }
        </style>

        <div class="user-box" role="form">
            <div class="tabs">
                <button id="tabLogin" class="tab-btn active">Logg inn</button>
                <button id="tabReg" class="tab-btn">Opprett</button>
            </div>

            <input type="text" id="uname" placeholder="Brukernavn" aria-label="Brukernavn">
            <input type="password" id="psw" placeholder="Passord" aria-label="Passord">
            
            <div id="tosArea" class="tos-area">
                <label>
                    <input type="checkbox" id="consent"> 
                    Godta <a href="Terms%20Of%20Service%20-%20PokeGuesser.pdf" target="_blank" rel="noopener">ToS</a> 
                    & <a href="Privacy%20Policy%20-%20PokeGuesser.pdf" target="_blank" rel="noopener">Privacy</a>.
                </label>
            </div>

            <button id="mainActionBtn" class="action-btn">Logg inn</button>
            <p id="msg" aria-live="polite"></p>
            <span id="delBtn" class="del-link">Slett min konto</span>
        </div>
    </template>

    <script type="module" src="app.js"></script>
    <script>
        document.getElementById('toggleLogin').onclick = () => {
            document.getElementById('userMenu').classList.toggle('active');
        };
    </script>
</body>
</html>
