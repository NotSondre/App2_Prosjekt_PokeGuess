<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéGuess - Hvem er denne Pokémonen?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding-top: 80px;
            background-image: url('Images/PokeGuess-Background.jpg');
            background-size: cover;
            background-attachment: fixed;
        }

        /* Header / Navigasjon */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #b2d0ec;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .logo img {
            height: 40px;
            cursor: pointer;
        }

        /* Spill-layout */
        .game-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            align-items: flex-start;
        }

        /* Venstre side: Regionsvelger */
        .region-sidebar {
            background: white;
            border: 3px solid #000;
            border-radius: 15px;
            padding: 15px;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .region-sidebar h3 {
            margin: 0 0 10px 0;
            text-align: center;
            font-size: 1.2rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        .region-btn {
            text-align: left;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .region-btn:hover {
            background: #f0f8ff;
            transform: translateX(5px);
        }

        .region-btn.active {
            background: #2196F3;
            color: white;
            border-color: #0d47a1;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Midten: Spillkortet */
        .game-card {
            background: white;
            border: 3px solid #000;
            border-radius: 20px;
            padding: 30px;
            flex-grow: 1;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .score-display {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            background: #f8f9fa;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #ddd;
        }

        .pokemon-box {
            height: 300px;
            background-color: #f9f9f9;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 2px inset #eee;
            position: relative;
            overflow: hidden;
        }

        #pokemonImage {
            max-height: 90%;
            max-width: 90%;
            display: none;
            filter: brightness(0); /* Starter som silhuett */
            transition: filter 0.3s ease;
        }

        #pokemonImage.revealed {
            filter: brightness(1);
        }

        #pokemonInput {
            width: 80%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
        }

        #pokemonInput:focus {
            border-color: #2196F3;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active { transform: scale(0.95); }

        #guessBtn { background-color: #4CAF50; color: white; }
        #nextBtn { background-color: #ff4444; color: white; }
        
        #authBtn {
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        #guessResult {
            height: 30px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                align-items: center;
            }
            .region-sidebar {
                width: 100%;
                flex-direction: row;
                overflow-x: auto;
                padding: 10px;
            }
            .region-btn {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">
        <a href="index.html">
            <img src="Images/Poke-Guessr_Logo.png" alt="PokéGuess Logo">
        </a>
    </div>
    <div id="userSection">
        <button id="authBtn" onclick="location.href='login.html'">Logg inn</button>
    </div>
</header>

<main>
    <div class="game-container">
        
        <aside class="region-sidebar">
            <h3>Regioner</h3>
            <button class="region-btn active" data-region="all">Alle Generasjoner</button>
            <button class="region-btn" data-region="kanto">Kanto (Gen 1)</button>
            <button class="region-btn" data-region="johto">Johto (Gen 2)</button>
            <button class="region-btn" data-region="hoenn">Hoenn (Gen 3)</button>
            <button class="region-btn" data-region="sinnoh">Sinnoh (Gen 4)</button>
            <button class="region-btn" data-region="unova">Unova (Gen 5)</button>
            <button class="region-btn" data-region="kalos">Kalos (Gen 6)</button>
            <button class="region-btn" data-region="alola">Alola (Gen 7)</button>
            <button class="region-btn" data-region="galar">Galar (Gen 8)</button>
            <button class="region-btn" data-region="paldea">Paldea (Gen 9)</button>
        </aside>

        <section class="game-card">
            <div class="score-display">Poeng: <span id="currentScore">0</span></div>
            
            <div class="pokemon-box">
                <img id="pokemonImage" src="" alt="Hvem er denne Pokémonen?">
            </div>

            <div id="guessResult"></div>
            
            <input type="text" id="pokemonInput" placeholder="Skriv navnet her..." autocomplete="off">
            
            <div class="button-group">
                <button id="guessBtn" class="btn">Gjett!</button>
                <button id="nextBtn" class="btn">Vet Ikke!</button>
            </div>
        </section>

    </div>
</main>

<script src="app.js"></script>
</body>
</html>
