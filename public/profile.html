<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Profil - PokéGuess</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2a75bb;
            background-image: url('Images/PokeGuess-Background.jpg');
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 3px solid #000;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ffcb05;
            margin-bottom: 15px;
            object-fit: cover;
            background: #f0f0f0;
        }

        h2 { margin: 10px 0; color: #333; }

        .score-list {
            margin-top: 20px;
            text-align: left;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
        }

        .delete-score-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .delete-score-btn:hover { background: #cc0000; }

        .nav-btns {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }

        .btn-back { background: #2196F3; }
        .btn-logout { background: #ff4444; }
    </style>
</head>
<body>

<div class="profile-card">
    <img id="displayPic" class="profile-pic" src="" alt="Profilbilde">
    <h2 id="displayUsername">Laster...</h2>
    
    <div class="score-list">
        <h3>Dine Toppnoteringer</h3>
        <div id="scoreContainer">Laster poengsummer...</div>
    </div>

    <div class="nav-btns">
        <a href="index.html" class="btn btn-back">Tilbake til spillet</a>
        <button onclick="logout()" class="btn btn-logout">Logg ut</button>
    </div>
</div>

<script src="profile.js"></script>
</body>
</html>
