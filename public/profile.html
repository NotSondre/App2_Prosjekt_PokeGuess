<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéGuess - Profil</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 80px;
            background-image: url('Images/PokeGuess-Background.jpg');
            background-size: cover;
            background-attachment: fixed;
        }

        .header {
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px; background: #b2d0ec;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 100;
        }

        .profile-box {
            background: #fff;
            border: 3px solid #000;
            border-radius: 15px;
            padding: 30px;
            display: inline-block;
            min-width: 350px;
        }

        /* Piksel-art styling */
        #currentPic, #previewImg {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            background: #fdfdfd;
            border: 2px solid #eee;
            border-radius: 10px;
        }

        .score-list { list-style: none; padding: 0; }
        .score-list li {
            display: flex; justify-content: space-between;
            padding: 10px; border: 1px solid #ddd; margin-bottom: 5px;
            border-radius: 5px;
        }

        .search-area { margin: 15px 0; border-top: 1px solid #eee; padding-top: 15px; }
        input { padding: 8px; border-radius: 5px; border: 1px solid #ccc; width: 150px; }
        button { padding: 8px 12px; cursor: pointer; font-weight: bold; border-radius: 5px; border: none; }
        #confirmPicBtn { background: #4CAF50; color: white; margin-top: 5px; }
        #logoutBtn { background: #ff4444; color: white; }
    </style>
</head>
<body>

<header class="header">
    <a href="index.html">
        <img src="Images/Poke-Guessr_Logo.png" alt="Logo" style="height: 40px;">
    </a>
    <button id="logoutBtn">Logg ut</button>
</header>

<main>
    <div class="profile-box">
        <h1>Min Profil</h1>
        
        <div class="pic-section">
            <img id="currentPic" src="" alt="Profilbilde" style="width: 120px; height: 120px;">
            <div class="username" id="usernameDisplay" style="font-weight: bold; font-size: 1.2rem; margin: 10px 0;"></div>
            
            <div class="search-area">
                <p style="font-size: 0.9rem; margin-bottom: 5px;">Søk etter piksel-profilbilde:</p>
                <input type="text" id="pokeSearch" placeholder="Pokémon navn...">
                <button id="searchBtn">Søk</button>
                
                <div id="searchPreview" style="display: none; margin-top: 10px;">
                    <img id="previewImg" src="" style="width: 80px; height: 80px;">
                    <br>
                    <button id="confirmPicBtn">Lagre dette bildet</button>
                </div>
            </div>
        </div>

        <h3>Dine Toppscorer</h3>
        <ul class="score-list" id="scoreList"></ul>
        <p id="noScoresMsg" style="display:none; color: #888;">Ingen scorer ennå.</p>
        <p id="notLoggedIn" style="display:none; color: red;">Du er ikke logget inn.</p>
        
        <br>
        <a href="index.html" style="text-decoration: none; color: #007bff; font-weight: bold;">← Tilbake til spillet</a>
    </div>
</main>

<script src="profile.js"></script>
</body>
</html>
