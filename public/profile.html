<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Profil - PokéGuess</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2a75bb;
            background-image: url('Images/PokeGuess-Background.jpg');
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 3px solid #000;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ffcb05;
            margin-bottom: 15px;
            object-fit: contain;
            background: #f0f0f0;
            image-rendering: pixelated;
        }

        h2 { margin: 10px 0; color: #333; }

        /* Redigeringspanel */
        #editPanel {
            display: none;
            margin: 15px 0;
            padding: 20px;
            background: #fdfdfd;
            border: 2px dashed #ffcb05;
            border-radius: 12px;
            text-align: left;
        }

        .edit-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        #searchPreview {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            min-height: 120px;
            border: 1px solid #eee;
        }

        .score-list {
            margin-top: 20px;
            text-align: left;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
        }

        .delete-score-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .nav-btns {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }

        .btn-edit { background: #ffcb05; color: #333; }
        .btn-back { background: #2196F3; }
        .btn-logout { background: #666; }
        .btn-save { background: #4CAF50; width: 100%; margin-top: 10px; }
        .btn-search { background: #333; margin-bottom: 10px; width: 100%; }
    </style>
</head>
<body>

<div class="profile-card">
    <img id="displayPic" class="profile-pic" src="" alt="Profilbilde">
    <h2 id="displayUsername">Laster...</h2>
    
    <button onclick="toggleEdit()" class="btn btn-edit">Rediger Profil</button>

    <div id="editPanel">
        <label>Endre Brukernavn:</label>
        <input type="text" id="newNameInput" class="edit-input" placeholder="Nytt navn...">
        
        <label>Søk etter nytt bilde (Navn eller ID):</label>
        <input type="text" id="pokemonSearchInput" class="edit-input" placeholder="f.eks. charmander eller 4">
        <button onclick="searchPokemon()" class="btn btn-search">Finn Pokémon</button>

        <div id="searchPreview">
            <p id="searchStatus" style="color: #999;">Ingen Pokémon valgt</p>
            <img id="previewPic" src="" style="display:none; width: 96px; height: 96px; image-rendering: pixelated;">
            <p id="previewName" style="font-weight: bold; text-transform: capitalize; margin: 5px 0 0 0;"></p>
        </div>

        <button onclick="saveProfileChanges()" class="btn btn-save">Lagre alt</button>
    </div>

    <div class="score-list">
        <h3>Topp 5 Poengsummer</h3>
        <div id="scoreContainer">Henter poeng...</div>
    </div>

    <div class="nav-btns">
        <a href="index.html" class="btn btn-back">Tilbake til spillet</a>
        <button onclick="logout()" class="btn btn-logout">Logg ut</button>
    </div>
</div>

<script src="profile.js"></script>
</body>
</html>
