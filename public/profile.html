<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Profil - PokéGuess</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2a75bb;
            background-image: url('Images/PokeGuess-Background.jpg');
            background-size: cover;
            background-attachment: fixed;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            min-height: 100vh;
        }

        .profile-card, .delete-account-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
            border: 3px solid #000;
            text-align: center;
        }

        .delete-account-card {
            margin-top: 20px;
            border-color: #ff4444;
            padding: 20px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ffcb05;
            margin-bottom: 15px;
            object-fit: contain;
            background: #f0f0f0;
            image-rendering: pixelated;
        }

        #editPanel {
            display: none;
            margin: 15px 0;
            padding: 20px;
            background: #fdfdfd;
            border: 2px dashed #ffcb05;
            border-radius: 12px;
            text-align: left;
        }

        .edit-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        #searchPreview {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            min-height: 120px;
            border: 1px solid #eee;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            color: white;
            display: inline-block;
        }

        .btn-edit { background: #ffcb05; color: #333; }
        .btn-back { background: #2196F3; }
        .btn-logout { background: #ff4444; }
        .btn-save { background: #4CAF50; width: 100%; margin-top: 10px; }
        .btn-search { background: #333; margin-bottom: 10px; width: 100%; }
        .btn-danger { background: #ff4444; width: 100%; margin-top: 10px; }

        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
        .danger-title { color: #ff4444; margin: 0 0 10px 0; }
    </style>
</head>
<body>

<div class="profile-card">
    <img id="displayPic" class="profile-pic" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Profilbilde">
    <h2 id="displayUsername">Laster...</h2>
    
    <button onclick="toggleEdit()" class="btn btn-edit">Rediger Profil</button>

    <div id="editPanel">
        <label>Endre Brukernavn:</label>
        <input type="text" id="newNameInput" class="edit-input" placeholder="Nytt navn...">
        <hr>
        <label>Søk etter pokemon for nytt bilde:</label>
        <input type="text" id="pokemonSearchInput" class="edit-input" placeholder="f.eks. Bulbasaur">
        <button onclick="searchPokemon()" class="btn btn-search">Finn Pokémon</button>

        <div id="searchPreview">
            <p id="searchStatus" style="color: #999;">Søker...</p>
            <img id="previewPic" src="" style="display:none; width: 96px; height: 96px; image-rendering: pixelated;">
            <p id="previewName" style="font-weight: bold; text-transform: capitalize; margin: 5px 0 0 0;"></p>
        </div>
        <hr>
        <label>Endre Passord:</label>
        <input type="password" id="oldPasswordInput" class="edit-input" placeholder="Gammelt passord">
        <input type="password" id="newPasswordInput" class="edit-input" placeholder="Nytt passord">
        <button onclick="saveProfileChanges()" class="btn btn-save">Lagre alt</button>
    </div>

    <div class="score-list" style="text-align: left; margin-top: 20px;">
        <h3>Topp 5 Highscores</h3>
        <div id="scoreContainer">Henter poeng...</div>
    </div>

    <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
        <a href="index.html" class="btn btn-back">Tilbake</a>
        <button onclick="logout()" class="btn btn-logout">Logg ut</button>
    </div>
</div>

<div class="delete-account-card">
    <h3 class="danger-title">SLETT KONTO</h3>
    <input type="password" id="deleteConfirmPassword" class="edit-input" placeholder="Passord for å slette...">
    <button onclick="deleteAccount()" class="btn btn-danger">Slett konto</button>
</div>

<script src="profile.js"></script>
</body>
</html>
